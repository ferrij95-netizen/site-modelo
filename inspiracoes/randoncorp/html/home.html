<!DOCTYPE html><html lang="pt-BR"><head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Bloqueado</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      text-align: center;
      padding: 2rem;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    h1 {
      color: #d9534f;
    }
    p {
      font-size: 1rem;
      margin: 1rem 0;
    }
    .code {
      font-family: monospace;
      background: #f8f8f8;
      padding: 0.5rem;
      border-radius: 5px;
      display: inline-block;
      margin: 1rem 0;
    }
    a {
      color: #0275d8;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      text-decoration: underline;
    }
    .logo {
      margin: 1rem 0;
    }
    .language-selector {
      margin-top: 1rem;
    }
    button {
      padding: 0.5rem 1rem;
      margin: 0 0.5rem;
      border: none;
      border-radius: 5px;
      background-color: #0275d8;
      color: white;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background-color: #025aa5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title">Acesso Bloqueado!</h1>
    <p id="message">O acesso a esta aplicação foi bloqueado pelo sistema de segurança.</p>
    <p id="error-code">Código de erro: <span id="error-value">0.8b78ce17.1791483819.75ec412c</span></p>
    <p id="contact">Se você acredita que isto é um erro, favor enviar estas informações para o e-mail si@randoncorp.com.</p>
    <div class="logo">
      <img src="https://www.randoncorp.com/media/2524/logo_randoncorp.png" alt="Logo da randoncorp" width="150">
    </div>
    <div class="language-selector">
      <button onclick="changeLanguage('pt')">Português</button>
      <button onclick="changeLanguage('en')">English</button>
      <button onclick="changeLanguage('es')">Español</button>
    </div>
  </div>

  <script>
    const translations = {
      pt: {
        title: "Acesso Bloqueado!",
        message: "O acesso a esta aplicação foi bloqueado pelo sistema de segurança.",
        errorCode: "Código de erro: ",
        contact: "Se você acredita que isto é um erro, favor enviar estas informações para o e-mail si@randoncorp.com."
      },
      en: {
        title: "Access Blocked!",
        message: "Access to this application has been blocked by the security system.",
        errorCode: "Error code: ",
        contact: "If you believe this is an error, please send this information to si@randoncorp.com."
      },
      es: {
        title: "Acceso Bloqueado!",
        message: "El acceso a esta aplicación ha sido bloqueado por el sistema de seguridad.",
        errorCode: "Código de error: ",
        contact: "Si cree que se trata de un error, envíe esta información a si@randoncorp.com."
      }
    };

    function changeLanguage(lang) {
      document.getElementById("title").innerText = translations[lang].title;
      document.getElementById("message").innerText = translations[lang].message;

      // Mantém o AK_REFERENCE_ID sem sobrescrever
      const errorId = document.getElementById("error-value").innerText;
      document.getElementById("error-code").innerHTML = translations[lang].errorCode + " <span id='error-value'>" + errorId + "</span>";

      document.getElementById("contact").innerText = translations[lang].contact;
    }
  </script>


</body></html>
