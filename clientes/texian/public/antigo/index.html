<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Texian · Site atual (registro)</title>
<link rel="icon" href="../img/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 Inter,system-ui,sans-serif;color:#14181F;background:#E9ECF1}
.bar{position:sticky;top:0;z-index:2;background:#14181F;color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.bar b{font-size:15px;margin-right:auto}
.bar small{display:block;font-weight:400;color:#A9B2BF;font-size:12px}
.tabs,.dev{display:flex;gap:4px;flex-wrap:wrap}
button{font:600 13px Inter,sans-serif;border:1px solid #3A424E;background:transparent;color:#D5DAE1;padding:7px 12px;cursor:pointer;border-radius:4px}
button[aria-pressed=true]{background:#fff;color:#14181F;border-color:#fff}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{font:600 13px Inter,sans-serif;color:#fff;text-decoration:none;padding:7px 12px;border-radius:4px;background:#E02B20}
.links a.old{background:#4A5361}
main{padding:24px 16px 60px;display:flex;justify-content:center}
main img{display:block;width:100%;max-width:1440px;height:auto;box-shadow:0 10px 40px rgba(0,0,0,.15);background:#fff}
main.celular img{max-width:420px}
@media (max-width:700px){.bar{position:static}}
</style>
</head>
<body>
<div class="bar">
  <b>Site atual da Texian<small>Registro de texian.com.br em 08/10/2026, para comparar com as propostas novas</small></b>
  <div class="tabs" id="tabs">
    <button data-p="home">Início</button>
    <button data-p="sobre">Sobre</button>
    <button data-p="historia">História</button>
    <button data-p="clientes">Clientes</button>
    <button data-p="manutencoes-e-montagens">Manutenções e montagens</button>
    <button data-p="projetos">Projetos</button>
    <button data-p="tecnologia-e-solucoes-personalizadas">Tecnologia</button>
    <button data-p="petroquimico-quimico-oleo-e-gas">Áreas de atuação</button>
    <button data-p="noticias">Notícias</button>
    <button data-p="contato">Contato</button>
  </div>
  <div class="dev" id="dev">
    <button data-d="computador">Computador</button>
    <button data-d="celular">Celular</button>
  </div>
  <div class="links">
    <a class="old" id="ao-vivo" href="https://texian.com.br/" target="_blank" rel="noopener">Site atual ao vivo ↗</a>
    <a id="novo" href="/direcoes/">Ver as propostas novas →</a>
  </div>
</div>
<main id="main"><img id="shot" alt="Página do site atual da Texian"></main>
<script>
const vivo={home:'',sobre:'sobre/',historia:'historia/',clientes:'clientes/','manutencoes-e-montagens':'manutencoes-e-montagens/',projetos:'projetos/','tecnologia-e-solucoes-personalizadas':'tecnologia-e-solucoes-personalizadas/','petroquimico-quimico-oleo-e-gas':'petroquimico-quimico-oleo-e-gas/',noticias:'noticias/',contato:'contato/'};
let p='home',d='computador';
const q=new URLSearchParams(location.search);
if(q.get('p')in vivo)p=q.get('p');
if(q.get('d')==='celular'||(!q.get('d')&&innerWidth<700))d='celular';
function show(){
  shot.src='img/'+p+'-'+d+'.jpg';
  main.className=d;
  document.querySelectorAll('#tabs button').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.p===p)});
  document.querySelectorAll('#dev button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.d===d));
  document.getElementById('ao-vivo').href='https://texian.com.br/'+vivo[p];
  history.replaceState(null,'','?p='+p+'&d='+d);
}
tabs.onclick=e=>{if(e.target.dataset.p){p=e.target.dataset.p;show();scrollTo(0,0)}};
dev.onclick=e=>{if(e.target.dataset.d){d=e.target.dataset.d;show()}};
show();
</script>
</body>
</html>
