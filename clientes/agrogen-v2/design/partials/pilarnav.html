<section class="sec sand"><div class="wrap">
  <div class="sec-head reveal"><div><span class="eyebrow">Nossos pilares</span><h2>Conheça os outros pilares</h2></div><a class="btn line" href="/{{lang}}/pilares">{{t.nav.allPilares}}</a></div>
  <div class="pgrid">{{#each t.pilares}}<a class="pilar reveal pc-{{it.id}}" href="/{{lang}}/{{it.id}}"><img src="/img/{{it.img}}.jpg" alt="" loading="lazy" width="600" height="400"><div><h3>{{it.name}}</h3><p>{{it.short}}</p><span class="go">{{t.more}} →</span></div></a>{{/each}}</div>
</div></section>
