<section class="cta"><div class="wrap">
  <div>
    <span class="mono">{{t.nav.contato}}</span>
    <h2>{{t.contactTitle}}</h2>
    <p>{{t.contactText}}</p>
    <a class="btn light" href="{{wa}}" target="_blank" rel="noopener">{{t.wa}}</a>
  </div>
  <ul>
    <li><span>{{t.labels.phone}}</span><a href="{{wa}}" target="_blank" rel="noopener">{{site.phone}}</a></li>
    <li><span>{{t.labels.email}}</span><a href="mailto:{{site.email}}">{{site.email}}</a></li>
    <li><span>{{t.labels.address}}</span><a href="{{site.mapsUrl}}" target="_blank" rel="noopener">{{site.addressShort}}</a></li>
    <li><span>{{t.labels.hours}}</span><b>{{site.hoursShort}}</b></li>
  </ul>
</div></section>
