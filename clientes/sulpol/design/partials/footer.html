<footer class="site-footer"><div class="wrap">
  <div class="f-brand">
    <img src="/img/logo-h.png" alt="{{site.name}}" width="415" height="132" loading="lazy">
    <p>{{t.footerText}}</p>
  </div>
  <div>
    <span class="mono">{{t.footerCompany}}</span>
    <nav class="f-nav">{{navLinks}}</nav>
  </div>
  <div>
    <span class="mono">{{t.footerContact}}</span>
    <p>{{site.address}}</p>
    <p><a href="{{wa}}" target="_blank" rel="noopener">{{site.phone}}</a><br><a href="mailto:{{site.email}}">{{site.email}}</a><br><a href="mailto:{{site.email2}}">{{site.email2}}</a></p>
  </div>
</div>
<div class="wrap f-bottom"><span>© {{year}} {{site.legalName}}</span><span>{{t.rights}}</span></div>
</footer>
