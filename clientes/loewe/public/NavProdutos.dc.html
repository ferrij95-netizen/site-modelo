<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ wrapRef }}" onMouseEnter="{{ open }}" onMouseLeave="{{ close }}" style="position:relative;display:flex;align-items:center;align-self:stretch">
  <a href="/produtos" onFocus="{{ open }}" style="padding:6px 0;display:flex;align-items:center;gap:6px;color:#fff;box-shadow:{{ shadow }}" style-hover="color:#fff">Produtos <svg width="10" height="10" viewBox="0 0 12 12" fill="none" aria-hidden="true" style="display:block;opacity:.75;transform:{{ caret }};transition:transform .25s ease"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
  <sc-if value="{{ isOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;top:100%;left:{{ panelLeft }};padding-top:30px;z-index:60;cursor:default">
      <div style="width:{{ panelW }};background:#fff;color:#1C1B1A;box-shadow:0 30px 60px -24px rgba(28,27,26,.45);border-top:3px solid #9C0016;display:grid;grid-template-columns:{{ cols }};white-space:normal;text-align:left">
        <div style="padding:28px 28px 24px;display:flex;flex-direction:column;gap:4px;border-right:1px solid #E6E3DD">
          <a href="/produtos#ind" onClick="{{ close }}" style="font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9C0016;padding-bottom:10px">Industriais</a>
          <sc-for list="{{ ind }}" as="c" hint-placeholder-count="5">
            <a href="{{ c.href }}" onClick="{{ close }}" style="font-size:15px;font-weight:500;padding:7px 0;color:#1C1B1A;display:flex;justify-content:space-between;gap:12px" style-hover="color:#9C0016">{{ c.name }}</a>
          </sc-for>
        </div>
        <div style="padding:28px 28px 24px;display:flex;flex-direction:column;gap:22px;border-right:1px solid #E6E3DD">
          <div style="display:flex;flex-direction:column;gap:4px">
            <a href="/produtos#disp" onClick="{{ close }}" style="font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9C0016;padding-bottom:10px">Dispositivos</a>
            <sc-for list="{{ disp }}" as="d" hint-placeholder-count="4">
              <a href="{{ d.href }}" onClick="{{ close }}" style="font-size:15px;font-weight:500;padding:7px 0;color:#1C1B1A" style-hover="color:#9C0016">{{ d.name }}</a>
            </sc-for>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;padding-top:18px;border-top:1px solid #E6E3DD">
            <a href="/produtos#cons" onClick="{{ close }}" style="font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9C0016;padding-bottom:10px">Consumidores</a>
            <sc-for list="{{ cons }}" as="k" hint-placeholder-count="2">
              <a href="{{ k.href }}" onClick="{{ close }}" style="font-size:15px;font-weight:500;padding:7px 0;color:#1C1B1A" style-hover="color:#9C0016">{{ k.name }}</a>
            </sc-for>
          </div>
        </div>
        <sc-if value="{{ showPhoto }}" hint-placeholder-val="{{ true }}"><a href="/catalogo" target="_blank" rel="noopener" onClick="{{ close }}" style="position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:280px;color:#fff;background:#1C1B1A url('/assets/prod-solda-resistores.webp') center/cover;border-top:0" style-hover="color:#fff">
          <span style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,27,26,.1) 20%,rgba(28,27,26,.9) 100%)"></span>
          <span style="position:relative;padding:24px;display:flex;flex-direction:column;gap:8px">
            <span style="font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8)">Edição 2026</span><span style="font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.25">Catálogo de produtos e serviços</span>
            <span style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.85)">Abrir catálogo →</span>
          </span>
        </a></sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:420},&quot;active&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { o: false, left: 0, w: 860, photo: true };
  wrapRef = React.createRef();
  place() {
    const el = this.wrapRef.current; if (!el) return;
    const r = el.getBoundingClientRect(), vw = document.documentElement.clientWidth;
    const photo = vw >= 1000;
    const w = Math.min(photo ? 860 : 620, vw - 48);
    let left = r.width / 2 - w / 2;
    left = Math.max(24 - r.left, Math.min(left, vw - 24 - r.left - w));
    this.setState({ left, w, photo });
  }
  renderVals() {
    const P = '/produtos#';
    const on = !!this.props.active;
    const { left, w, photo } = this.state;
    return {
      wrapRef: this.wrapRef,
      panelLeft: left + 'px', panelW: w + 'px', showPhoto: photo,
      cols: photo ? 'minmax(0,1.35fr) minmax(0,1fr) minmax(0,.95fr)' : 'minmax(0,1.2fr) minmax(0,1fr)',
      isOpen: this.state.o,
      open: () => { clearTimeout(this.t); if (!this.state.o) this.place(); this.setState({ o: true }); },
      close: () => { clearTimeout(this.t); this.t = setTimeout(() => this.setState({ o: false }), 120); },
      shadow: on ? 'inset 0 -2px 0 #fff' : 'none',
      caret: this.state.o ? 'rotate(180deg)' : 'none',
      ind: [['Automação industrial','auto'],['Retrofit','ind'],['Automação para corte a laser','laser'],['Equipamentos de segurança NR-12','nr12'],['Equipamentos industriais','equip'],['Manipuladores','manip'],['Máquinas','maq'],['Máquinas','ind']].map(([name, k]) => ({ name, href: P + k })),
      disp: [['Dispositivos de medição','disp-med'],['Dispositivos de montagem','disp-mon'],['Dispositivos de usinagem','disp-usi'],['Dispositivos de soldagem','disp-sol']].map(([name, k]) => ({ name, href: P + k })),
      cons: [['Baú de caminhão','bau'],['Churrasqueiras','cons']].map(([name, k]) => ({ name, href: P + k }))
    };
  }
}
</script>
</body>
</html>
