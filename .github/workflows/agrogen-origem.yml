# Baixa logo, imagens, HTML, textos, cores e prints do site atual da Agrogen para clientes/agrogen/_origem/.
name: agrogen-origem
on:
  push:
    branches: [claude/project-thread-ixmy4w]
    paths: [.github/workflows/agrogen-origem.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Navegar pelo site, baixar tudo e tirar prints
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          cat > crawl.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs'); const path = require('path'); const crypto = require('crypto');
          const O = 'clientes/agrogen/_origem';
          for (const d of ['html', 'img', 'prints']) fs.mkdirSync(`${O}/${d}`, { recursive: true });
          const START = 'https://www.agrogen.com.br/';
          const host = h => h.replace(/^www\./, '');
          const slug = u => { const p = new URL(u).pathname.replace(/\/+$/, '').replace(/^\//, ''); return (p || 'home').replace(/[^a-zA-Z0-9]+/g, '-').slice(0, 80); };
          const seenImg = new Map();
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36' });
            ctx.on('response', async r => {
              try {
                const ct = r.headers()['content-type'] || '';
                if (!/image\//.test(ct) || r.status() !== 200) return;
                const u = r.url(); if (seenImg.has(u)) return;
                const buf = await r.body(); if (buf.length < 2500) return;
                const ext = (ct.split('/')[1] || 'bin').split(/[;+]/)[0].replace('jpeg', 'jpg');
                let base = decodeURIComponent(path.basename(new URL(u).pathname)).replace(/\.[a-z0-9]+$/i, '').replace(/[^a-zA-Z0-9_-]+/g, '_').slice(0, 60) || 'img';
                const f = `${base}-${crypto.createHash('md5').update(u).digest('hex').slice(0, 6)}.${ext}`;
                seenImg.set(u, f); fs.writeFileSync(`${O}/img/${f}`, buf);
              } catch {}
            });
            const queue = [START]; const done = new Set(); const status = []; const estilosPorPagina = {};
            while (queue.length && done.size < 40) {
              const u = queue.shift(); const key = u.replace(/[#?].*$/, '').replace(/\/+$/, '');
              if (done.has(key)) continue; done.add(key);
              const pg = await ctx.newPage(); await pg.setViewportSize({ width: 1440, height: 900 });
              const resp = await pg.goto(u, { waitUntil: 'networkidle', timeout: 60000 }).catch(e => null);
              status.push(`${u} ${resp ? resp.status() : 'erro'} ${pg.url()}`);
              await pg.waitForTimeout(2500);
              for (const sel of ['text=Aceitar', 'text=Aceito', 'text=Concordo', 'text=Accept', 'text=OK']) await pg.click(sel, { timeout: 500 }).catch(() => {});
              // rola até o fim para carregar imagens preguiçosas
              await pg.evaluate(async () => { for (let y = 0; y < document.body.scrollHeight; y += 600) { window.scrollTo(0, y); await new Promise(r => setTimeout(r, 150)); } window.scrollTo(0, 0); });
              await pg.waitForTimeout(1500);
              const s = slug(pg.url());
              fs.writeFileSync(`${O}/html/${s}.html`, await pg.content());
              const info = await pg.evaluate(() => {
                const out = {};
                for (const el of document.querySelectorAll('*')) {
                  const st = getComputedStyle(el);
                  for (const k of ['color', 'backgroundColor', 'borderTopColor']) { const v = st[k]; if (v && v !== 'rgba(0, 0, 0, 0)') out[v] = (out[v] || 0) + 1; }
                  out['font:' + st.fontFamily] = (out['font:' + st.fontFamily] || 0) + 1;
                }
                return {
                  titulo: document.title,
                  descricao: (document.querySelector('meta[name=description]') || {}).content || '',
                  txt: document.body.innerText,
                  links: [...document.querySelectorAll('a[href]')].map(a => ({ href: a.href, texto: a.innerText.trim().slice(0, 80) })),
                  imgs: [...document.querySelectorAll('img')].map(i => ({ src: i.currentSrc || i.src, alt: i.alt, w: i.naturalWidth, h: i.naturalHeight })),
                  bgs: [...document.querySelectorAll('*')].map(e => getComputedStyle(e).backgroundImage).filter(v => v && v.includes('url(')),
                  estilos: Object.entries(out).sort((a, b) => b[1] - a[1]).slice(0, 60),
                };
              });
              fs.writeFileSync(`${O}/html/${s}.txt`, `# ${info.titulo}\n# ${info.descricao}\n\n${info.txt}`);
              fs.writeFileSync(`${O}/html/${s}.json`, JSON.stringify({ url: pg.url(), titulo: info.titulo, descricao: info.descricao, links: info.links, imgs: info.imgs, bgs: info.bgs }, null, 1));
              estilosPorPagina[s] = info.estilos;
              await pg.screenshot({ path: `${O}/prints/${s}-computador.png`, fullPage: true }).catch(() => {});
              await pg.setViewportSize({ width: 390, height: 844 }); await pg.waitForTimeout(1200);
              await pg.screenshot({ path: `${O}/prints/${s}-celular.png`, fullPage: true }).catch(() => {});
              for (const l of info.links) {
                try {
                  const x = new URL(l.href);
                  if (host(x.hostname) !== 'agrogen.com.br') continue;
                  if (/\.(pdf|jpe?g|png|gif|webp|zip|docx?|xlsx?|mp4)$/i.test(x.pathname)) { status.push(`arquivo ${x.href}`); continue; }
                  if (/wp-(admin|login|json)|feed|\/tag\/|\/author\/|mailto:|tel:/.test(x.href)) continue;
                  queue.push(x.origin + x.pathname);
                } catch {}
              }
              await pg.close();
            }
            fs.writeFileSync(`${O}/html/status.txt`, status.join('\n') + '\n');
            fs.writeFileSync(`${O}/estilos.json`, JSON.stringify(estilosPorPagina, null, 1));
            fs.writeFileSync(`${O}/img/lista.json`, JSON.stringify(Object.fromEntries(seenImg), null, 1));
            await b.close();
          })();
          JS
          node crawl.cjs
          O=clientes/agrogen/_origem
          # PDFs (catálogos, fichas) que aparecem nos links
          mkdir -p $O/arquivos
          grep '^arquivo ' $O/html/status.txt | awk '{print $2}' | grep -i '\.pdf$' | sort -u | head -30 | while read u; do curl -sSL --fail --max-filesize 30000000 -o "$O/arquivos/$(basename "$u")" "$u" || true; done
          # Remove prints/imagens gigantes que não servem para o repositório
          find $O -type f -size +20M -delete
          du -sh $O; ls $O/html; cat $O/html/status.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add clientes/agrogen/_origem
          git commit -m "Agrogen: arquivos do site atual" && git pull --rebase origin claude/project-thread-ixmy4w && git push
