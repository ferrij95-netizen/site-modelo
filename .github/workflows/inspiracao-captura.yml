# Captura prints, HTML e estilos de um site de referência para o banco de inspirações (inspiracoes/<nome>/).
name: inspiracao-captura
on:
  push:
    branches: [claude/project-thread-r0bkvf]
    paths: [.github/workflows/inspiracao-captura.yml, inspiracoes/lista.txt]
permissions:
  contents: write
jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prints
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          cat > shot.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const DIR = 'inspiracoes/' + process.env.NOME;
          async function semCookies(pg) {
            const re = /^\s*(accept all( cookies)?|allow all( cookies)?|accept|aceitar( todos| tudo| cookies)?|aceito|concordo|i agree|agree|ok|entendi|got it|allow|permitir todos)\s*$/i;
            for (const fr of pg.frames()) {
              await fr.evaluate((src) => {
                const re = new RegExp(src, 'i');
                const ids = ['#onetrust-accept-btn-handler', '#CybotCookiebotDialogBodyLevelButtonLevelOptinAllowAll', '#CybotCookiebotDialogBodyButtonAccept', '#uc-btn-accept-banner', '.cky-btn-accept', '#truste-consent-button'];
                for (const q of ids) { const el = document.querySelector(q); if (el) el.click(); }
                for (const el of document.querySelectorAll('button, a[role=button], [role=button]')) if (re.test(el.innerText || '')) { try { el.click(); } catch (e) {} }
              }, re.source).catch(() => {});
            }
            await pg.waitForTimeout(1200);
            await pg.evaluate(() => {
              for (const el of document.querySelectorAll('body *')) {
                const s = getComputedStyle(el); const k = (el.id + ' ' + el.className).toLowerCase();
                if ((s.position === 'fixed' || s.position === 'sticky') && /cookie|consent|onetrust|cybot|usercentrics|gdpr|lgpd|privacy|adopt/.test(k)) el.remove();
              }
              document.body.style.overflow = 'auto'; document.documentElement.style.overflow = 'auto';
            }).catch(() => {});
          }
          (async () => {
            const b = await chromium.launch();
            const info = { pedido: process.env.URL, paginas: [] };
            const home = await b.newPage({ viewport: { width: 1440, height: 900 }, userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36', locale: 'pt-BR' });
            await home.goto(process.env.URL, { waitUntil: 'networkidle', timeout: 60000 }).catch(e => info.erro = String(e));
            await home.waitForTimeout(3000);
            info.final = home.url();
            const origin = new URL(home.url()).origin;
            const links = await home.evaluate(o => [...new Set([...document.querySelectorAll('header a[href], nav a[href], a[href]')]
              .map(a => a.href.split('#')[0]).filter(h => h.startsWith(o)))], origin).catch(() => []);
            const pages = [home.url(), ...links.filter(l => l.replace(/\/$/, '') !== home.url().replace(/\/$/, ''))].slice(0, Number(process.env.PAGS || 6));
            await home.close();
            for (const [i, url] of pages.entries()) {
              const slug = i === 0 ? 'home' : (new URL(url).pathname.replace(/^\/|\/$/g, '').replace(/[^a-z0-9]+/gi, '-') || 'p' + i);
              for (const [w, h, t] of [[1440, 900, 'computador'], [390, 844, 'celular']]) {
                const pg = await b.newPage({ viewport: { width: w, height: h }, userAgent: w > 500 ? 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36' : 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.5 Mobile/15E148 Safari/604.1', locale: 'pt-BR', isMobile: w < 500, hasTouch: w < 500 });
                await pg.goto(url, { waitUntil: 'networkidle', timeout: 60000 }).catch(() => {});
                await pg.waitForTimeout(3000);
                await semCookies(pg);
                // força animações de rolagem a aparecerem
                await pg.evaluate(async () => { for (let y = 0; y < document.body.scrollHeight; y += 600) { window.scrollTo(0, y); await new Promise(r => setTimeout(r, 150)); } window.scrollTo(0, 0); }).catch(() => {});
                await pg.waitForTimeout(1500);
                await pg.screenshot({ path: `${DIR}/prints/${slug}-${t}.png`, fullPage: true }).catch(() => {});
                await pg.screenshot({ path: `${DIR}/prints/${slug}-${t}-dobra.png` }).catch(() => {});
                if (t === 'computador') {
                  fs.writeFileSync(`${DIR}/html/${slug}.html`, await pg.content());
                  const meta = await pg.evaluate(() => {
                    const count = {};
                    const add = (k) => count[k] = (count[k] || 0) + 1;
                    for (const el of document.querySelectorAll('*')) {
                      const s = getComputedStyle(el);
                      for (const k of ['color', 'backgroundColor', 'borderTopColor']) { const v = s[k]; if (v && v !== 'rgba(0, 0, 0, 0)') add(k + ':' + v); }
                      add('font:' + s.fontFamily);
                    }
                    const heads = [...document.querySelectorAll('h1,h2,h3')].slice(0, 40).map(h => {
                      const s = getComputedStyle(h); return { tag: h.tagName, texto: h.innerText.trim().slice(0, 120), fonte: s.fontFamily, tamanho: s.fontSize, peso: s.fontWeight, ls: s.letterSpacing };
                    });
                    const body = getComputedStyle(document.body);
                    return { titulo: document.title, descricao: document.querySelector('meta[name=description]')?.content, gerador: document.querySelector('meta[name=generator]')?.content,
                      corpo: { fonte: body.fontFamily, tamanho: body.fontSize, cor: body.color, fundo: body.backgroundColor }, titulos: heads,
                      secoes: [...document.querySelectorAll('body > *, main > *, section')].slice(0, 60).map(e => e.tagName + (e.id ? '#' + e.id : '') + (e.className && typeof e.className === 'string' ? '.' + e.className.trim().split(/\s+/).slice(0, 3).join('.') : '')),
                      estilos: Object.entries(count).sort((a, b) => b[1] - a[1]).slice(0, 80) };
                  }).catch(e => ({ erro: String(e) }));
                  info.paginas.push({ slug, url, ...meta });
                }
                await pg.close();
              }
            }
            fs.writeFileSync(`${DIR}/captura.json`, JSON.stringify(info, null, 1));
            await b.close();
          })();
          JS
          grep -v '^#' inspiracoes/lista.txt | while read NOME URL PAGS; do
            [ -n "$NOME" ] || continue
            [ -f inspiracoes/$NOME/captura.json ] && continue
            mkdir -p inspiracoes/$NOME/prints inspiracoes/$NOME/html
            NOME=$NOME URL=$URL PAGS=${PAGS:-1} timeout 300 node shot.cjs || echo "falhou $NOME"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add inspiracoes
          git commit -m "Inspiração: capturas da lista" && git pull --rebase origin claude/project-thread-r0bkvf && git push
