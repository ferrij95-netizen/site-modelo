# Busca clínicas e consultórios no Google Maps e dá nota aos sites (resultado em prospeccao/clinicas/saida/).
name: prospeccao-clinicas
on:
  push:
    branches: [claude/project-thread-6t6iqu]
    paths: [.github/workflows/prospeccao-carros.yml, prospeccao/clinicas/maps.cjs, prospeccao/clinicas/analisa.py]
permissions:
  contents: write
jobs:
  maps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cidade: [São Paulo, Rio de Janeiro, Belo Horizonte, Brasília, Curitiba, Porto Alegre, Salvador, Recife, Fortaleza, Goiânia, Campinas, Florianópolis, Ribeirão Preto, Londrina, Joinville, Caxias do Sul, Uberlândia, Sorocaba, Natal, Maceió, Campo Grande, Cuiabá, Vitória, Juiz de Fora, Maringá, Santos, São José dos Campos, Teresina, João Pessoa, Belém]
    steps:
      - uses: actions/checkout@v4
      - name: Buscar no Maps
        working-directory: prospeccao/clinicas
        env:
          CIDADE: ${{ matrix.cidade }}
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node maps.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maps-${{ strategy.job-index }}
          path: prospeccao/clinicas/saida/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-${{ strategy.job-index }}
          path: prospeccao/clinicas/debug-*.png
          if-no-files-found: ignore
  analisa:
    needs: maps
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: maps-*
          path: prospeccao/clinicas/saida
          merge-multiple: true
      - name: Checar sites
        working-directory: prospeccao/clinicas
        run: |
          pip install requests
          python analisa.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add -f prospeccao/clinicas/saida
          git commit -m "Prospecção clínicas: resultados" && git pull --rebase origin claude/project-thread-6t6iqu && git push
