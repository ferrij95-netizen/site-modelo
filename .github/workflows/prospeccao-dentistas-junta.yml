# Só a etapa final da coleta de dentistas: baixa os resultados já prontos da execução 37872950693 e junta.
name: prospeccao-dentistas-junta
on:
  push:
    branches: [claude/project-thread-c8qi04]
    paths: [.github/workflows/prospeccao-dentistas-junta.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  junta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 37872950693
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prospeccao/dentistas/saida
          merge-multiple: true
      - name: Juntar
        working-directory: prospeccao/dentistas
        run: python junta.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add -f prospeccao/dentistas/saida/resultado.json prospeccao/dentistas/saida/todos.json
          git commit -m "Prospecção dentistas: resultados [skip ci]" && git pull --rebase origin claude/project-thread-c8qi04 && git push
