# Recupera os resultados do Maps da rodada 37843930498 (cujo commit falhou) e grava no ramo.
name: prospeccao-medicos-junta
on:
  push:
    branches: [claude/project-thread-0xo7ls]
    paths: [.github/workflows/prospeccao-medicos-junta.yml]
permissions:
  contents: write
  actions: read
jobs:
  junta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: maps-*
          path: prospeccao/medicos
          merge-multiple: true
          run-id: 37843930498
          github-token: ${{ github.token }}
      - name: Commit
        run: |
          ls -R prospeccao/medicos | head -40
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add -f prospeccao/medicos/saida
          git add -f prospeccao/medicos/debug-*.png 2>/dev/null || true
          git commit -m "Prospecção médicos: Maps" && git pull --rebase origin claude/project-thread-0xo7ls && git push
