# O site atual da De Filippo só tem fotos minúsculas (2010). Baixa fotos livres do Unsplash (licença Unsplash) para os previews.
name: defilippo-fotos
on:
  push:
    branches: [claude/project-thread-4nqz4o]
    paths: [.github/workflows/defilippo-fotos.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar e baixar
        run: |
          O=clientes/defilippo/_origem/banco; mkdir -p $O
          for q in "car mechanic workshop" "auto repair garage" "fiat 500" "alfa romeo" "car engine bay" "car brake disc" "mechanic tools" "car suspension" "vintage italian car" "car diagnostic"; do
            s=$(echo "$q" | tr ' ' '-')
            curl -sSL -A "Mozilla/5.0" "https://unsplash.com/napi/search/photos?query=$(echo $q | sed 's/ /%20/g')&per_page=12&orientation=landscape" -o /tmp/$s.json || continue
            jq -r '.results[] | select(.premium != true and .plus != true) | [.id, .urls.raw, .user.name, (.alt_description // "" | gsub("[\\t\\n]";" "))] | @tsv' /tmp/$s.json | head -8 | while IFS=$'\t' read id raw autor alt; do
              curl -sSL --fail -m 60 -o "$O/$s-$id.jpg" "$raw&w=1800&q=72&fm=jpg&fit=max" && printf '%s\t%s\t%s\t%s\n' "$s-$id.jpg" "$autor" "https://unsplash.com/photos/$id" "$alt" >> $O/creditos.tsv
            done
          done
          ls $O | wc -l; du -sh $O
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add clientes/defilippo/_origem/banco
          git commit -m "De Filippo: banco de fotos livres" && git pull --rebase origin claude/project-thread-4nqz4o && git push
