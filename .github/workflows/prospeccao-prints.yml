# Tira prints dos sites da prospecção de carros (resultado em prospeccao/carros/saida/prints/).
name: prospeccao-prints
on:
  push:
    branches: [claude/project-thread-poo1un]
    paths: [.github/workflows/prospeccao-prints.yml, prospeccao/carros/prints.cjs, prospeccao/carros/sites.txt]
permissions:
  contents: write
jobs:
  prints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prints
        working-directory: prospeccao/carros
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node prints.cjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add -f prospeccao/carros/saida/prints
          git commit -m "Prospecção carros: prints dos sites" && git pull --rebase origin claude/project-thread-poo1un && git push
