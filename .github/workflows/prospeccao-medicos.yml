# Garimpo de médicos com pouca presença digital (resultado em prospeccao/medicos/).
name: prospeccao-medicos
on:
  push:
    branches: [claude/project-thread-0xo7ls]
    paths: [.github/workflows/prospeccao-medicos.yml, prospeccao/medicos/*.py, prospeccao/medicos/*.cjs]
permissions:
  contents: write
jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Coletar CNES
        working-directory: prospeccao/medicos
        run: |
          pip install requests pandas pyreaddbc
          python coleta.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add -f prospeccao/medicos/saida
          git commit -m "Prospecção médicos: coleta CNES" && git pull --rebase origin claude/project-thread-0xo7ls && git push
