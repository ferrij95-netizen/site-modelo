<section class="page-head">
  <div class="wrap stack"><div class="eyebrow eyebrow-light">{{p.eyebrow}}</div><h1>{{p.heading}}</h1></div>
</section>
<section class="section">
  <div class="wrap about">
    <div class="stack">
      <p class="lead-dark">{{p.text}}</p>
      <div class="btn-row"><a class="btn btn-brand" href="{{wa}}" target="_blank" rel="noopener">{{t.wa}} <span aria-hidden="true">→</span></a></div>
    </div>
    <dl class="rows">
      <div><dt>{{t.labels.phone}}</dt><dd><a href="tel:{{site.phoneHref}}">{{site.phone}}</a></dd></div>
      <div><dt>{{t.labels.email}}</dt><dd><a href="mailto:{{site.email}}">{{site.email}}</a></dd></div>
      <div><dt>{{t.labels.address}}</dt><dd>{{site.address}}</dd></div>
    </dl>
  </div>
</section>
