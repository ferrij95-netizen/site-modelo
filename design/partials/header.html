<div class="topbar">
  <div class="wrap topbar-inner">
    <div class="topbar-info">
      <a href="tel:{{site.phoneHref}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.18 2 2 0 0 1 4.08 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>{{site.phone}}</a>
      <a class="hide-sm" href="mailto:{{site.email}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>{{site.email}}</a>
      <span class="hide-md">{{site.address}}</span>
    </div>
    <div class="lang-switch" aria-label="Idioma / Language">
      {{langLinks}}
    </div>
  </div>
</div>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/{{lang}}/">
      {{#if site.logo}}<img src="/{{site.logo}}" alt="{{site.name}}">{{else}}<span class="brand-name">{{site.name}}</span>{{/if}}
      <span class="brand-sep hide-md"></span><span class="brand-tag hide-md">{{{site.tagline}}}</span>
    </a>
    <nav id="nav" class="nav">
      {{navLinks}}
      <a class="nav-cta-mobile" href="{{wa}}" target="_blank" rel="noopener">{{t.wa}}</a>
    </nav>
    <a class="btn btn-light header-cta" href="{{wa}}" target="_blank" rel="noopener">{{t.cta}}</a>
    <button class="menu-toggle" aria-expanded="false" aria-controls="nav" aria-label="{{t.menu}}"><span></span><span></span><span></span></button>
  </div>
</header>
